<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dice Engine Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <style>
        :root {
            --bg:           #040507;
            --accent:       #00ffa3;
            --accent-glow:  rgba(0, 255, 163, 0.35);
            --crit:         #ffcf00;
            --fail:         #ff4b4b;
            --glass:        rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.09);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #fff;
            user-select: none;
        }

        canvas { display: block; }

        /* Ambient background vignette + gradient halo */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background:
                radial-gradient(ellipse 90% 55% at 50% -5%,  rgba(0,255,163,0.07) 0%, transparent 65%),
                radial-gradient(ellipse 70% 40% at 90% 105%, rgba(60,80,220,0.06)  0%, transparent 60%),
                radial-gradient(ellipse 100% 60% at 50% 110%, rgba(0,0,0,0.7)     0%, transparent 70%);
        }

        /* ─── UI Layer ─────────────────────────────── */
        .ui-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            padding-top: 28px;
            pointer-events: none; z-index: 10;
        }

        /* ─── Header pill ─────────────────────────── */
        .header-controls {
            background: rgba(6, 8, 14, 0.80);
            backdrop-filter: blur(48px) saturate(160%);
            -webkit-backdrop-filter: blur(48px) saturate(160%);
            padding: 10px 10px 10px 22px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; gap: 4px;
            max-width: calc(100vw - 24px);
            pointer-events: auto;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.6),
                0 24px 64px rgba(0,0,0,0.75),
                0 0 40px rgba(0,255,163,0.04);
            will-change: transform;
            transition: box-shadow 0.4s ease;
        }
        .header-controls:focus-within {
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.6),
                0 24px 64px rgba(0,0,0,0.75),
                0 0 0 2px rgba(0,255,163,0.2),
                0 0 40px rgba(0,255,163,0.1);
        }

        .divider {
            width: 1px; height: 30px;
            background: var(--glass-border);
            flex-shrink: 0; margin: 0 8px;
        }

        .input-group { display: flex; flex-direction: column; padding: 2px 6px; }
        .input-group label {
            font-size: 8px; text-transform: uppercase;
            letter-spacing: 2.5px; color: rgba(255,255,255,0.28);
            margin-bottom: 3px; font-weight: 700;
        }
        input {
            background: transparent; border: none;
            color: #fff; font-size: 15px; outline: none;
            font-weight: 700; font-family: 'Inter', sans-serif;
            letter-spacing: -0.3px;
        }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
        #diceInput      { width: 100px; }
        #highlightInput { width: 34px; }
        #targetInput    { width: 34px; }

        .btn-main {
            background: var(--accent); color: #000; border: none;
            padding: 12px 22px; border-radius: 100px;
            font-weight: 800; cursor: pointer;
            font-size: 11px; letter-spacing: 1.5px;
            text-transform: uppercase; font-family: 'Inter', sans-serif;
            transition:
                transform 0.28s cubic-bezier(0.2, 1, 0.3, 1),
                box-shadow 0.28s cubic-bezier(0.2, 1, 0.3, 1);
            will-change: transform;
        }
        .btn-main:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 10px 28px var(--accent-glow), 0 0 0 1px rgba(0,255,163,0.25);
        }
        .btn-main:active { transform: scale(0.96); }

        /* ─── Rolling Indicator ───────────────────── */
        .rolling-pill {
            margin-top: 18px;
            background: rgba(6, 8, 14, 0.70);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 100px; padding: 6px 18px;
            font-size: 10px; letter-spacing: 2.5px;
            text-transform: uppercase; color: rgba(255,255,255,0.35);
            font-weight: 700; pointer-events: none;
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .rolling-pill.visible { opacity: 1; transform: translateY(0); }
        .rolling-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent); flex-shrink: 0;
            animation: blink 0.9s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.3; transform: scale(0.6); }
        }

        /* ─── Special message overlay ─────────────── */
        #special-msg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.72) translateY(10px);
            font-size: clamp(52px, 9vw, 88px);
            font-weight: 900; text-transform: uppercase;
            text-align: center; pointer-events: none; opacity: 0;
            transition:
                opacity  0.55s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            white-space: nowrap; z-index: 5;
            letter-spacing: -3px; line-height: 1;
        }
        #special-msg.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) translateY(0);
        }
        .crit {
            color: var(--accent);
            text-shadow:
                0 0 18px rgba(0,255,163,0.9),
                0 0 50px rgba(0,255,163,0.5),
                0 0 100px rgba(0,255,163,0.2);
        }
        .fail {
            color: var(--fail);
            text-shadow:
                0 0 18px rgba(255,75,75,0.9),
                0 0 50px rgba(255,75,75,0.5),
                0 0 100px rgba(255,75,75,0.2);
        }

        /* ─── Result HUD ──────────────────────────── */
        .result-hud {
            position: absolute;
            bottom: max(44px, env(safe-area-inset-bottom) + 28px);
            left: 50%; transform: translate(-50%, 18px);
            text-align: center; pointer-events: none;
            opacity: 0; width: max-content; max-width: calc(100vw - 40px);
            transition:
                opacity   0.75s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .result-hud.visible { opacity: 1; transform: translate(-50%, 0); }

        .success-count {
            font-size: clamp(72px, 11vw, 110px);
            font-weight: 900; line-height: 0.85;
            letter-spacing: -6px;
            background: linear-gradient(155deg, #ffffff 30%, rgba(255,255,255,0.38) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .success-label {
            font-size: 11px; letter-spacing: 7px;
            color: var(--accent); font-weight: 700;
            text-transform: uppercase; margin-top: 6px;
        }
        .success-breakdown {
            font-size: 11px; color: rgba(255,255,255,0.25);
            letter-spacing: 0.5px; margin-top: 8px; font-weight: 500;
        }

        /* ─── Input error shake ──────────────────────── */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-6px); }
            40%      { transform: translateX(6px); }
            60%      { transform: translateX(-4px); }
            80%      { transform: translateX(4px); }
        }
        .header-controls.shake { animation: shake 0.42s ease; }
        #diceInput.invalid     { color: var(--fail); transition: color 0.3s ease; }

        /* ─── Mobile responsive ──────────────────── */
        @media (max-width: 600px) {
            .ui-layer        { padding-top: 16px; }
            .header-controls { padding: 8px 8px 8px 14px; gap: 2px; }
            .input-group label { font-size: 7px; letter-spacing: 2px; }
            input            { font-size: 13px; }
            #diceInput       { width: 76px; }
            #highlightInput  { width: 26px; }
            #targetInput     { width: 26px; }
            .divider         { height: 24px; margin: 0 5px; }
            .btn-main        { padding: 10px 16px; font-size: 10px; letter-spacing: 1px; }
            .rolling-pill    { margin-top: 12px; }
            #special-msg     { font-size: clamp(30px, 11vw, 64px); letter-spacing: -1px; }
            .success-count   { font-size: clamp(52px, 16vw, 90px); letter-spacing: -4px; }
        }

        /* ─── Reduced motion ──────────────────────── */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

<div class="ui-layer">
    <div class="header-controls">
        <div class="input-group">
            <label>Dice Pool</label>
            <input type="text" id="diceInput" value="6d6" placeholder="e.g. 2d6, 1d20" title="Valid dice: d4 d6 d8 d10 d20 d100 — separate groups with commas" spellcheck="false" autocomplete="off">
        </div>
        <div class="divider"></div>
        <div class="input-group">
            <label>Highlight</label>
            <input type="number" id="highlightInput" value="2" min="0" max="99">
        </div>
        <div class="divider"></div>
        <div class="input-group">
            <label>Target</label>
            <input type="number" id="targetInput" value="4" min="1" max="20">
        </div>
        <button class="btn-main" onclick="rollDice()">Roll</button>
    </div>

    <div class="rolling-pill" id="rollingPill">
        <span class="rolling-dot"></span>Rolling…
    </div>

    <div id="special-msg"></div>

    <div class="result-hud" id="resultHud">
        <div class="success-count" id="countDisplay">0</div>
        <div class="success-label" id="successLabel">Successes</div>
        <div class="success-breakdown" id="breakdownDisplay"></div>
    </div>
</div>

<script>
    // ── State ──────────────────────────────────────────
    let scene, camera, renderer;
    let dice = [], particles = [];
    let isRolling = false;
    let cameraTime = 0;
    let cameraBaseY = 22;   // updated by setCameraForViewport
    let accentLight, critLight;
    let pendingResult = null;

    // ── Viewport helpers ───────────────────────────────
    // Adjust FOV + position so the whole dice grid is always visible,
    // regardless of screen size or orientation.
    function setCameraForViewport() {
        const w = window.innerWidth;
        if (w < 480) {
            camera.fov = 65; cameraBaseY = 16;
            camera.position.set(0, 16, 20);
        } else if (w < 768) {
            camera.fov = 52; cameraBaseY = 18;
            camera.position.set(0, 18, 23);
        } else {
            camera.fov = 32; cameraBaseY = 22;
            camera.position.set(0, 22, 28);
        }
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
    }

    // Returns grid layout params suited to the current screen width.
    function getGridParams() {
        const w = window.innerWidth;
        if (w < 480) return { maxCols: 2, xGap: 3.4, zGap: 3.4 };
        if (w < 768) return { maxCols: 3, xGap: 4.4, zGap: 4.2 };
        return              { maxCols: 4, xGap: 5.5, zGap: 5.2 };
    }

    // ── Die type constants ─────────────────────────────
    const VALID_SIDES = new Set([4, 6, 8, 10, 20, 100]);
    const SHAPE = { SQ: 'sq', TRI: 'tri', PENT: 'pent', KITE: 'kite' };

    function getDiceShape(sides) {
        if (sides <= 4)  return SHAPE.TRI;
        if (sides <= 6)  return SHAPE.SQ;
        if (sides <= 8)  return SHAPE.TRI;
        if (sides <= 10) return SHAPE.KITE;
        if (sides <= 12) return SHAPE.PENT;
        return SHAPE.TRI; // d20, d100
    }

    // Approximate collision sphere radius for each die type.
    // Used for die-to-die collision detection (sphere-sphere).
    function getDiceRadius(sides) {
        if (sides <= 4)  return 1.50; // tetrahedron
        if (sides <= 6)  return 1.55; // cube  (half-diagonal ≈ 1.91, shrunk for feel)
        if (sides <= 8)  return 1.50; // octahedron
        if (sides <= 10) return 1.55; // d10
        if (sides <= 12) return 1.50; // dodecahedron
        return 1.45;                  // icosahedron d20/d100
    }

    // Height of die center above the floor at rest (rotation 0,0,0)
    function getDiceTargetY(sides) {
        if (sides <= 4)  return 1.10; // tetrahedron: two lowest vertices at same y
        if (sides <= 6)  return 1.10; // cube half-height
        if (sides <= 8)  return 1.80; // octahedron: vertex straight down
        if (sides <= 10) return 1.75; // d10: bottom pole (poleH = r*1.0 = 1.70)
        if (sides <= 12) return 1.58; // dodecahedron
        return 1.45;                  // icosahedron
    }

    // ── UV remapping for triangular-faced polyhedra ────
    // Maps each triangle face to the same UV triangle so a
    // centered canvas texture is correctly shown on every face.
    function remapTriUVs(geo) {
        const n = geo.attributes.position.count; // 3 per face
        const uvArr = new Float32Array(n * 2);
        for (let f = 0; f < n / 3; f++) {
            uvArr[f*6+0]=0.50; uvArr[f*6+1]=0.95; // apex  (top-center of canvas)
            uvArr[f*6+2]=0.05; uvArr[f*6+3]=0.05; // left  (bottom-left of canvas)
            uvArr[f*6+4]=0.95; uvArr[f*6+5]=0.05; // right (bottom-right of canvas)
        }
        geo.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
        return geo;
    }

    // ── UV remapping for dodecahedron ──────────────────
    // 12 pentagonal faces × 3 sub-triangles (fan from hub vertex) × 3 vertices = 108
    function remapPentUVs(geo) {
        const uvArr = new Float32Array(108 * 2);
        // Regular pentagon corners in UV space, hub vertex at top
        const pUV = [
            [0.500, 0.950], // corner 0 – hub / apex
            [0.082, 0.654], // corner 1
            [0.241, 0.145], // corner 2
            [0.759, 0.145], // corner 3
            [0.918, 0.654], // corner 4
        ];
        const fans = [[0,1,2],[0,2,3],[0,3,4]]; // fan triangulation of pentagon
        for (let f = 0; f < 12; f++) {
            for (let t = 0; t < 3; t++) {
                const [a,b,c] = fans[t];
                const vi = f*9 + t*3;
                uvArr[vi*2+0]=pUV[a][0]; uvArr[vi*2+1]=pUV[a][1];
                uvArr[vi*2+2]=pUV[b][0]; uvArr[vi*2+3]=pUV[b][1];
                uvArr[vi*2+4]=pUV[c][0]; uvArr[vi*2+5]=pUV[c][1];
            }
        }
        geo.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
        return geo;
    }

    // ── Custom d10: pentagonal trapezohedron ───────────
    // Proportions tuned to match a real Chessex-style d10:
    //   poleH=1.0r → clearly pointed poles, taller-than-wide silhouette
    //   tilt =0.30r → well-separated equatorial band
    //   eqR  =0.88r → slightly narrower waist
    // Per-kite flat normals (2 triangles per kite share one normal) eliminate
    // the visible seam that computeVertexNormals would leave inside each face.
    function buildD10Geo() {
        const r=1.7, N=5;
        const poleH = r * 1.00;
        const tilt  = r * 0.30;
        const eqR   = r * 0.88;
        const top = new THREE.Vector3(0,  poleH, 0);
        const bot = new THREE.Vector3(0, -poleH, 0);
        const upper = Array.from({length:N}, (_,k) => new THREE.Vector3(
            eqR*Math.cos(k*2*Math.PI/N),        tilt,  eqR*Math.sin(k*2*Math.PI/N)));
        const lower = Array.from({length:N}, (_,k) => new THREE.Vector3(
            eqR*Math.cos((k+0.5)*2*Math.PI/N), -tilt,  eqR*Math.sin((k+0.5)*2*Math.PI/N)));

        // Kite UV corners (UV.y=1 → canvas top, UV.y=0 → canvas bottom)
        const A=[0.50,0.95], L=[0.05,0.50], B=[0.50,0.05], R=[0.95,0.50];

        const pos=[], uv=[];
        function tri(v0,v1,v2, u0,u1,u2) {
            pos.push(v0.x,v0.y,v0.z, v1.x,v1.y,v1.z, v2.x,v2.y,v2.z);
            uv.push(...u0,...u1,...u2);
        }
        for (let k=0; k<N; k++) {
            const k2=(k+1)%N;
            // Upper kite — CCW from outside (cross-product verified):
            tri(top, upper[k2], lower[k],  A, R, B);
            tri(top, lower[k],  upper[k],  A, B, L);
            // Lower kite — CCW from outside:
            tri(bot, lower[k],  upper[k2], A, L, B);
            tri(bot, upper[k2], lower[k2], A, B, R);
        }

        const posArr    = new Float32Array(pos);
        const uvArr     = new Float32Array(uv);
        const normalArr = new Float32Array(pos.length); // same length as positions

        // Per-kite flat normals: triangles 2t and 2t+1 belong to the same kite face.
        // Compute the normal from triangle 2t and assign it to all 6 vertices of that kite.
        // This removes the visible crease that would appear if each triangle had its own normal.
        const nKites = pos.length / 18; // 2 tris × 3 verts × 3 coords = 18 floats per kite
        for (let k = 0; k < nKites; k++) {
            const i = k * 18;
            const ex = posArr[i+3]-posArr[i],   ey = posArr[i+4]-posArr[i+1], ez = posArr[i+5]-posArr[i+2];
            const fx = posArr[i+6]-posArr[i],   fy = posArr[i+7]-posArr[i+1], fz = posArr[i+8]-posArr[i+2];
            const nx = ey*fz - ez*fy,  ny = ez*fx - ex*fz,  nz = ex*fy - ey*fx;
            const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
            for (let v = 0; v < 6; v++) {
                normalArr[i + v*3]     = nx/len;
                normalArr[i + v*3 + 1] = ny/len;
                normalArr[i + v*3 + 2] = nz/len;
            }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(posArr,    3));
        geo.setAttribute('uv',       new THREE.BufferAttribute(uvArr,     2));
        geo.setAttribute('normal',   new THREE.BufferAttribute(normalArr, 3));
        return geo;
    }

    // ── Geometry selector ──────────────────────────────
    function getDiceGeometry(sides) {
        if (sides <= 4)  return remapTriUVs(new THREE.TetrahedronGeometry(1.9));
        if (sides <= 6)  return new THREE.BoxGeometry(2.2, 2.2, 2.2);
        if (sides <= 8)  return remapTriUVs(new THREE.OctahedronGeometry(1.8));
        if (sides <= 10) return buildD10Geo();
        if (sides <= 12) return remapPentUVs(new THREE.DodecahedronGeometry(1.7));
        return remapTriUVs(new THREE.IcosahedronGeometry(1.7, 0)); // d20, d100
    }

    // ── Face texture ───────────────────────────────────
    // Draws the correct polygon shape on a canvas and places the number
    // at the shape's visual centroid. UV remapping ensures this texture
    // is correctly applied to each face of any polyhedron.
    function createFaceTex(number, isH, shape) {
        const S = 512;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = S;
        const ctx = canvas.getContext('2d');

        // Full-canvas gradient base
        const bg = ctx.createLinearGradient(0, 0, S, S);
        bg.addColorStop(0, isH ? '#2a1900' : '#131828');
        bg.addColorStop(1, isH ? '#110900' : '#070c13');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, S, S);

        // Face shape clip path
        ctx.beginPath();
        if (shape === SHAPE.TRI) {
            // UV (0.5,0.95),(0.05,0.05),(0.95,0.05) → canvas flip-v:
            // apex(256, 25), bl(25, 486), br(486, 486)
            ctx.moveTo(S*0.50, S*0.05);
            ctx.lineTo(S*0.05, S*0.95);
            ctx.lineTo(S*0.95, S*0.95);
            ctx.closePath();
        } else if (shape === SHAPE.PENT) {
            // Pentagon UV corners → canvas (flip v: cy = 1 - uv.y)
            const pts = [
                [0.500, 0.050],[0.082, 0.346],
                [0.241, 0.855],[0.759, 0.855],[0.918, 0.346],
            ];
            ctx.moveTo(pts[0][0]*S, pts[0][1]*S);
            for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*S, pts[i][1]*S);
            ctx.closePath();
        } else if (shape === SHAPE.KITE) {
            // Kite UV → canvas (flip v):
            // top(256,25), left(25,256), bottom(256,486), right(486,256)
            ctx.moveTo(S*0.50, S*0.05);
            ctx.lineTo(S*0.05, S*0.50);
            ctx.lineTo(S*0.50, S*0.95);
            ctx.lineTo(S*0.95, S*0.50);
            ctx.closePath();
        } else {
            // Rounded square (d6)
            const rr = 60;
            ctx.moveTo(rr,0); ctx.lineTo(S-rr,0); ctx.quadraticCurveTo(S,0,S,rr);
            ctx.lineTo(S,S-rr); ctx.quadraticCurveTo(S,S,S-rr,S);
            ctx.lineTo(rr,S);  ctx.quadraticCurveTo(0,S,0,S-rr);
            ctx.lineTo(0,rr);  ctx.quadraticCurveTo(0,0,rr,0);
            ctx.closePath();
        }

        // Face fill: slightly lighter than background
        const fc = ctx.createLinearGradient(0, 0, S, S);
        fc.addColorStop(0, isH ? 'rgba(82,46,0,0.92)' : 'rgba(38,56,96,0.72)');
        fc.addColorStop(1, isH ? 'rgba(42,22,0,0.92)' : 'rgba(18,28,56,0.72)');
        ctx.fillStyle = fc;
        ctx.fill();

        // Top-left bevel gleam
        const bv = ctx.createLinearGradient(0, 0, S*0.55, S*0.55);
        bv.addColorStop(0, isH ? 'rgba(255,207,0,0.13)' : 'rgba(255,255,255,0.08)');
        bv.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = bv;
        ctx.fill();

        // Face edge stroke
        ctx.strokeStyle = isH ? 'rgba(255,207,0,0.52)' : 'rgba(255,255,255,0.11)';
        ctx.lineWidth   = 7;
        ctx.stroke();

        // Number: place at centroid of the face shape in canvas space
        // Triangle centroid: (256, (S*0.05 + S*0.95 + S*0.95)/3) ≈ (256, S*0.65)
        const cy = (shape === SHAPE.TRI) ? S * 0.65 : S * 0.50;
        const numStr  = String(number);
        const fontSize = numStr.length >= 3 ? 170 : numStr.length === 2 ? 205 : 248;

        ctx.shadowColor = isH ? 'rgba(255,207,0,0.95)' : 'rgba(255,255,255,0.18)';
        ctx.shadowBlur  = isH ? 34 : 12;
        ctx.fillStyle   = isH ? '#ffe040' : '#ffffff';
        ctx.font        = `900 ${fontSize}px Inter, sans-serif`;
        ctx.textAlign   = 'center';
        ctx.textBaseline= 'middle';
        ctx.fillText(numStr, S/2, cy);

        return new THREE.CanvasTexture(canvas);
    }

    // ── d6 face number layout ──────────────────────────
    // Opposite faces sum to 7. Result goes on the +Y face (group index 2).
    function getD6FaceNumbers(result) {
        const opp = 7 - result;
        const rem = [1,2,3,4,5,6].filter(n=>n!==result&&n!==opp).sort((a,b)=>a-b);
        // BoxGeometry groups: [0]=+X [1]=-X [2]=+Y(top) [3]=-Y [4]=+Z [5]=-Z
        return [rem[0], rem[3], result, opp, rem[1], rem[2]];
    }

    // ── Init ───────────────────────────────────────────
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x040507);
        scene.fog = new THREE.FogExp2(0x040507, 0.016);

        // --- Lighting ---

        // Ambient: brighter cool-white so shadowed faces still show numbers
        scene.add(new THREE.AmbientLight(0x9aabcc, 0.80));

        // Key light: warm white, top-front-right, casts shadows
        const key = new THREE.DirectionalLight(0xfff8f0, 2.2);
        key.position.set(4, 18, 14);
        key.castShadow = true;
        key.shadow.mapSize.set(2048, 2048);
        key.shadow.camera.near   = 0.5;
        key.shadow.camera.far    = 80;
        key.shadow.camera.left   = -28;
        key.shadow.camera.right  = 28;
        key.shadow.camera.top    = 28;
        key.shadow.camera.bottom = -28;
        key.shadow.bias          = -0.001;
        key.shadow.normalBias    = 0.02;
        scene.add(key);

        // Camera-fill: near the viewing position so all camera-facing
        // faces (where numbers are most readable) are well-lit
        const camFill = new THREE.DirectionalLight(0xffffff, 1.0);
        camFill.position.set(0, 18, 26);
        scene.add(camFill);

        // Side fill: cool blue-violet from the left
        const fill = new THREE.DirectionalLight(0x4466dd, 0.75);
        fill.position.set(-14, 6, -4);
        scene.add(fill);

        // Under-fill: soft bounce from below to light underside faces
        const under = new THREE.DirectionalLight(0x334466, 0.45);
        under.position.set(0, -8, 6);
        scene.add(under);

        // Rim: deep indigo from behind
        const rim = new THREE.DirectionalLight(0x1a2255, 1.2);
        rim.position.set(0, 12, -22);
        scene.add(rim);

        // Reactive accent: green point light (floor bounce), starts dim
        accentLight = new THREE.PointLight(0x00ffa3, 0, 40);
        accentLight.position.set(0, 1, 4);
        scene.add(accentLight);

        // Crit burst: gold point light, starts off
        critLight = new THREE.PointLight(0xffcf00, 0, 50);
        critLight.position.set(0, 8, 0);
        scene.add(critLight);

        // --- Camera ---
        camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 1000);
        setCameraForViewport();
        camera.lookAt(0, -1, 0);

        // --- Renderer ---
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
        renderer.toneMapping       = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        document.body.prepend(renderer.domElement);

        // --- Floor ---
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x05070d,
            roughness: 0.85,
            metalness: 0.15,
        });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.08;
        floor.receiveShadow = true;
        scene.add(floor);

        // Subtle grid overlay
        const gridMat = new THREE.MeshBasicMaterial({
            color: 0x182240,
            transparent: true,
            opacity: 0.45,
            wireframe: true,
        });
        const grid = new THREE.Mesh(new THREE.PlaneGeometry(70, 70, 35, 35), gridMat);
        grid.rotation.x = -Math.PI / 2;
        grid.position.y = 0.005;
        scene.add(grid);

        window.addEventListener('resize', () => {
            setCameraForViewport();
            camera.lookAt(0, -1, 0);
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Press Enter to roll
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') rollDice();
        });
    }

    // ── Rest height per die type (inradius = center above floor when face-flat) ──
    function getDiceRestY(sides) {
        if (sides <= 4)  return 0.65;  // tetrahedron  inradius = R/3 ≈ 0.633
        if (sides <= 6)  return 1.10;  // cube         half-height = 1.1
        if (sides <= 8)  return 1.05;  // octahedron   inradius = R/√3 ≈ 1.039
        if (sides <= 10) return 1.05;  // d10          inradius with new proportions
        if (sides <= 12) return 1.35;  // dodecahedron inradius ≈ R*0.795 ≈ 1.352
        return 1.35;                   // icosahedron  inradius ≈ R*0.795 ≈ 1.352
    }

    // ── Face normals in local space for each geometry type ──
    // Used to find which face is currently pointing down so we can snap to it.
    function getGeoFaceNormals(geo) {
        if (geo.type === 'BoxGeometry') {
            // Cube: 6 axis-aligned face normals (hardcoded since BoxGeometry is indexed)
            return [
                new THREE.Vector3( 1, 0, 0), new THREE.Vector3(-1, 0, 0),
                new THREE.Vector3( 0, 1, 0), new THREE.Vector3( 0,-1, 0),
                new THREE.Vector3( 0, 0, 1), new THREE.Vector3( 0, 0,-1),
            ];
        }
        // Non-indexed polyhedra: first vertex of each triangle carries the face normal
        const na = geo.attributes.normal.array;
        const vertCount = na.length / 3;
        const normals = [];
        for (let v = 0; v < vertCount; v += 3) {
            normals.push(new THREE.Vector3(na[v*3], na[v*3+1], na[v*3+2]));
        }
        return normals;
    }

    // ── Quaternion that snaps die so its nearest face is flat on the floor ──
    function computeSnapQuat(mesh, faceNormals) {
        // Transform world-down (-Y) into local space to find closest face normal
        const localDown = new THREE.Vector3(0, -1, 0)
            .applyQuaternion(mesh.quaternion.clone().invert());

        let bestN = faceNormals[0], bestDot = -Infinity;
        for (const n of faceNormals) {
            const d = n.dot(localDown);
            if (d > bestDot) { bestDot = d; bestN = n; }
        }

        // Rotate that face's world-space normal to point straight down (0,-1,0)
        // target = correction * currentQuat, where correction rotates worldN → -Y
        const worldN = bestN.clone().applyQuaternion(mesh.quaternion).normalize();
        return new THREE.Quaternion()
            .setFromUnitVectors(worldN, new THREE.Vector3(0, -1, 0))
            .multiply(mesh.quaternion.clone());
    }

    // For d6: snap so the result face (+Y local) always points up, showing the result number
    function computeD6SnapQuat(mesh) {
        const worldLocalY = new THREE.Vector3(0, 1, 0).applyQuaternion(mesh.quaternion).normalize();
        const correction = new THREE.Quaternion().setFromUnitVectors(worldLocalY, new THREE.Vector3(0, 1, 0));
        return correction.multiply(mesh.quaternion.clone());
    }

    // ── Impact particle burst ──────────────────────────
    function spawnParticles(position, color) {
        const count = 20;
        for (let i = 0; i < count; i++) {
            const size = 0.05 + Math.random() * 0.1;
            const geo  = new THREE.SphereGeometry(size, 4, 4);
            const mat  = new THREE.MeshBasicMaterial({
                color, transparent: true, opacity: 0.85,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(position);
            mesh.position.y = 0.15;

            const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
            const speed = 0.07 + Math.random() * 0.16;
            scene.add(mesh);
            particles.push({
                mesh,
                vel: new THREE.Vector3(
                    Math.cos(angle) * speed,
                    0.06 + Math.random() * 0.14,
                    Math.sin(angle) * speed
                ),
                life: 1.0,
                decay: 0.022 + Math.random() * 0.018,
            });
        }
    }

    // ── Roll ───────────────────────────────────────────
    function rollDice(forceMode = null) {
        if (isRolling) return;
        isRolling = true;

        // Reset UI
        document.getElementById('resultHud').classList.remove('visible');
        const msg = document.getElementById('special-msg');
        msg.className = ''; msg.innerText = '';
        document.getElementById('rollingPill').classList.add('visible');

        // Clear old dice
        dice.forEach(d => {
            scene.remove(d.mesh);
            if (Array.isArray(d.mesh.material)) {
                d.mesh.material.forEach(m => { m.map?.dispose(); m.dispose(); });
            } else {
                d.mesh.material.map?.dispose();
                d.mesh.material.dispose();
            }
            d.mesh.geometry.dispose();
        });
        dice = [];

        const input  = document.getElementById('diceInput').value.toLowerCase();
        const target = parseInt(document.getElementById('targetInput').value) || 4;
        const groups = input.split(',');

        let successCount = 0;
        let totalCount   = 0;
        let highlightedValues = [];
        let diceConfigs = [];

        const hCount = parseInt(document.getElementById('highlightInput').value) || 0;

        let hasInvalidDie = false;

        groups.forEach(group => {
            // (\d*) lets "d6" work as "1d6"; i flag makes D/d both valid
            const match = group.trim().match(/^(\d*)d(\d+)$/i);
            if (!match) return;
            const count = parseInt(match[1]) || 1;
            const sides = parseInt(match[2]);

            if (!VALID_SIDES.has(sides)) {
                hasInvalidDie = true;
                return; // skip unknown die types silently
            }

            for (let i = 0; i < count; i++) {
                let val = Math.floor(Math.random() * sides) + 1;
                const isH = i < hCount;
                if (forceMode === 'crit' && isH) val = sides;
                if (forceMode === 'fail' && isH) val = 1;
                if (val >= target) successCount++;
                if (isH) highlightedValues.push({ val, sides });
                diceConfigs.push({ sides, val, isH });
                totalCount++;
            }
        });

        // Nothing to roll — reset UI and warn the user
        if (diceConfigs.length === 0) {
            document.getElementById('rollingPill').classList.remove('visible');
            isRolling = false;
            shakeInput();
            return;
        }

        // Partial invalid groups — shake while still rolling the valid ones
        if (hasInvalidDie) shakeInput();

        // Grid layout: responsive columns and spacing
        const { maxCols, xGap, zGap } = getGridParams();
        const cols    = Math.min(diceConfigs.length, maxCols);
        const rows    = Math.ceil(diceConfigs.length / cols);
        const zOffset = -((rows - 1) * zGap) / 2; // center the grid on z=0

        diceConfigs.forEach((data, i) => {
            const sides = data.sides;
            const shape = getDiceShape(sides);
            const geo   = getDiceGeometry(sides);

            const matBase = {
                roughness:          0.15,
                metalness:          0.08,
                clearcoat:          1.0,
                clearcoatRoughness: 0.06,
                reflectivity:       0.9,
            };

            // d6 only: proper 1–6 face layout with per-face materials, result on +Y.
            // All other dice: single UV-remapped texture, same number on every face.
            let material;
            if (sides === 6) {
                const faceNums = getD6FaceNumbers(data.val);
                material = faceNums.map(n =>
                    new THREE.MeshPhysicalMaterial({ ...matBase, map: createFaceTex(n, data.isH, SHAPE.SQ) })
                );
            } else {
                material = new THREE.MeshPhysicalMaterial({
                    ...matBase,
                    map: createFaceTex(data.val, data.isH, shape),
                });
            }

            const mesh = new THREE.Mesh(geo, material);
            mesh.castShadow    = true;
            mesh.receiveShadow = true;

            const row = Math.floor(i / cols), col = i % cols;
            // For the last row, center it if it has fewer dice than cols
            const rowDice  = Math.min(cols, diceConfigs.length - row * cols);
            const rowShift = (cols - rowDice) / 2;
            mesh.position.set(
                (col + rowShift - (cols - 1) / 2) * xGap,
                18 + Math.random() * 4,
                zOffset + row * zGap
            );
            mesh.rotation.set(
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2,
                Math.random() * Math.PI * 2
            );

            scene.add(mesh);
            dice.push({
                mesh,
                isH:      data.isH,
                val:      data.val,
                sides,
                targetY:  getDiceTargetY(sides),
                velocity: -0.06 - Math.random() * 0.04, // gentler initial drop; gravity does the work
                lateralV: new THREE.Vector2(
                    (Math.random() - 0.5) * 0.032,
                    (Math.random() - 0.5) * 0.024
                ),
                rotationV: {
                    x: (Math.random() - 0.5) * 0.42,
                    y: (Math.random() - 0.5) * 0.42,
                    z: (Math.random() - 0.5) * 0.35,
                },
                radius:           getDiceRadius(sides),
                bounces:          0,
                snapping:         false,   // snapping to face-flat orientation
                snapQuat:         null,    // target quaternion for snap
                restY:            getDiceRestY(sides),
                faceNormals:      getGeoFaceNormals(geo),
                isStopped:        false,
                spawnedParticles: false,
            });
        });

        // Flash accent light on roll
        accentLight.intensity = 6;
        fadeLight(accentLight, 0, 700);

        // Store result so the animate loop can reveal it the moment all dice stop
        pendingResult = { successCount, totalCount, target, highlightedValues, msg };
    }

    // ── Input error feedback ───────────────────────────
    function shakeInput() {
        const pill = document.querySelector('.header-controls');
        const inp  = document.getElementById('diceInput');
        pill.classList.add('shake');
        inp.classList.add('invalid');
        setTimeout(() => {
            pill.classList.remove('shake');
            inp.classList.remove('invalid');
        }, 600);
    }

    // ── Smooth light fade ──────────────────────────────
    function fadeLight(light, target, duration) {
        const start     = performance.now();
        const startVal  = light.intensity;
        function step(now) {
            const t = Math.min((now - start) / duration, 1);
            light.intensity = startVal + (target - startVal) * t;
            if (t < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    // ── Animate loop ───────────────────────────────────
    function animate() {
        requestAnimationFrame(animate);
        cameraTime += 0.0018;

        // Subtle camera float (offsets from the viewport-responsive base position)
        camera.position.x = Math.sin(cameraTime * 0.65) * 1.4;
        camera.position.y = cameraBaseY + Math.sin(cameraTime * 1.1) * 0.35;
        camera.lookAt(0, -1, 0);

        // Particle system
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.life -= p.decay;
            p.vel.y -= 0.005;
            p.mesh.position.addScaledVector(p.vel, 1);
            p.mesh.material.opacity = Math.max(0, p.life);
            if (p.life <= 0) {
                scene.remove(p.mesh);
                p.mesh.geometry.dispose();
                p.mesh.material.dispose();
                particles.splice(i, 1);
            }
        }

        // Dice physics
        dice.forEach(d => {
            if (d.isStopped) return;

            // ── Snap phase: smoothly rotate to nearest face-flat orientation ──
            if (d.snapping) {
                d.mesh.quaternion.slerp(d.snapQuat, 0.10);
                d.mesh.position.y = THREE.MathUtils.lerp(d.mesh.position.y, d.restY, 0.12);
                if (
                    d.mesh.quaternion.angleTo(d.snapQuat) < 0.008 &&
                    Math.abs(d.mesh.position.y - d.restY) < 0.005
                ) {
                    d.mesh.quaternion.copy(d.snapQuat);
                    d.mesh.position.y = d.restY;
                    d.isStopped = true;
                }
                return;
            }

            // ── Active physics ──
            d.mesh.position.y += d.velocity;
            d.mesh.position.x += d.lateralV.x;
            d.mesh.position.z += d.lateralV.y;
            d.velocity -= 0.009;

            if (d.mesh.position.y <= d.targetY) {
                d.mesh.position.y = d.targetY;
                d.velocity = Math.abs(d.velocity) * 0.52;
                d.bounces++;
                d.lateralV.multiplyScalar(0.55);
                d.rotationV.x *= 0.72;
                d.rotationV.y *= 0.72;
                d.rotationV.z *= 0.72;

                if (!d.spawnedParticles) {
                    d.spawnedParticles = true;
                    spawnParticles(d.mesh.position, d.isH ? 0xffcf00 : 0x00ffa3);
                }

                // On 3rd bounce: compute face-flat snap target and enter snap mode
                if (d.bounces >= 3) {
                    // d6: snap result face (+Y local) to top so the rolled number is always visible
                    // all other dice: snap nearest face flat (all faces already show the same number)
                    d.snapQuat = d.sides === 6
                        ? computeD6SnapQuat(d.mesh)
                        : computeSnapQuat(d.mesh, d.faceNormals);
                    d.snapping  = true;
                    return;
                }
            }

            d.mesh.rotation.x += d.rotationV.x;
            d.mesh.rotation.y += d.rotationV.y;
            d.mesh.rotation.z += d.rotationV.z;
        });

        // ── Dice-dice collision resolution ──────────────
        // Sphere-sphere model: each die has a radius; overlapping pairs are
        // pushed apart and their velocities are reflected along the contact normal.
        // We run 2 iterations per frame so stacked dice resolve quickly.
        for (let iter = 0; iter < 2; iter++) {
            for (let a = 0; a < dice.length - 1; a++) {
                for (let b = a + 1; b < dice.length; b++) {
                    const da = dice[a], db = dice[b];
                    const aActive = !da.isStopped && !da.snapping;
                    const bActive = !db.isStopped && !db.snapping;
                    if (!aActive && !bActive) continue;

                    const pa = da.mesh.position, pb = db.mesh.position;
                    const dx = pb.x - pa.x;
                    const dy = pb.y - pa.y;
                    const dz = pb.z - pa.z;
                    const distSq = dx*dx + dy*dy + dz*dz;
                    const minDist = da.radius + db.radius;
                    if (distSq >= minDist * minDist || distSq < 0.0001) continue;

                    const dist = Math.sqrt(distSq);
                    const pen  = minDist - dist;
                    const nx = dx / dist, ny = dy / dist, nz = dz / dist;

                    // ── Positional correction ──
                    // Active dice are pushed apart; stopped dice act as fixed walls.
                    if (aActive && bActive) {
                        pa.x -= nx * pen * 0.5;  pa.y -= ny * pen * 0.5;  pa.z -= nz * pen * 0.5;
                        pb.x += nx * pen * 0.5;  pb.y += ny * pen * 0.5;  pb.z += nz * pen * 0.5;
                    } else if (aActive) {
                        pa.x -= nx * pen;  pa.y -= ny * pen;  pa.z -= nz * pen;
                    } else {
                        pb.x += nx * pen;  pb.y += ny * pen;  pb.z += nz * pen;
                    }

                    // Never let dice fall through the floor during correction
                    if (aActive) pa.y = Math.max(pa.y, da.targetY);
                    if (bActive) pb.y = Math.max(pb.y, db.targetY);

                    // ── Velocity impulse ──
                    const restitution = 0.38;
                    const vax = aActive ? da.lateralV.x : 0, vay = aActive ? da.velocity : 0, vaz = aActive ? da.lateralV.y : 0;
                    const vbx = bActive ? db.lateralV.x : 0, vby = bActive ? db.velocity : 0, vbz = bActive ? db.lateralV.y : 0;
                    const vRel = (vbx - vax)*nx + (vby - vay)*ny + (vbz - vaz)*nz;

                    if (vRel < 0) { // only if approaching
                        const imp = -vRel * restitution / (aActive && bActive ? 1 : 0.5);
                        if (aActive) {
                            da.lateralV.x -= imp * nx;
                            da.velocity    -= imp * ny;
                            da.lateralV.y  -= imp * nz;
                            // Small extra spin on collision
                            da.rotationV.x += (Math.random() - 0.5) * 0.10;
                            da.rotationV.z += (Math.random() - 0.5) * 0.10;
                        }
                        if (bActive) {
                            db.lateralV.x += imp * nx;
                            db.velocity    += imp * ny;
                            db.lateralV.y  += imp * nz;
                            db.rotationV.x += (Math.random() - 0.5) * 0.10;
                            db.rotationV.z += (Math.random() - 0.5) * 0.10;
                        }
                    }
                }
            }
        }

        // Show result the moment every die has finished snapping flat
        if (pendingResult && dice.length > 0 && dice.every(d => d.isStopped)) {
            const { successCount, totalCount, target, highlightedValues, msg } = pendingResult;
            pendingResult = null;

            document.getElementById('rollingPill').classList.remove('visible');
            document.getElementById('countDisplay').innerText = successCount;
            document.getElementById('successLabel').innerText = successCount === 1 ? 'Success' : 'Successes';
            document.getElementById('breakdownDisplay').innerText =
                `${successCount} of ${totalCount} ${totalCount === 1 ? 'die' : 'dice'} ≥ ${target}`;
            document.getElementById('resultHud').classList.add('visible');

            if (highlightedValues.length > 0) {
                if (highlightedValues.every(h => h.val === h.sides)) {
                    msg.innerText = 'Critical Success';
                    msg.classList.add('active', 'crit');
                    critLight.color.set(0x00ffa3);
                    critLight.intensity = 8;
                    fadeLight(critLight, 0, 2000);
                } else if (highlightedValues.every(h => h.val === 1)) {
                    msg.innerText = 'Epic Fail';
                    msg.classList.add('active', 'fail');
                }
            }

            setTimeout(() => msg.classList.remove('active'), 3500);
            isRolling = false;
        }

        renderer.render(scene, camera);
    }

    init();
    animate();
    rollDice();
</script>
</body>
</html>
